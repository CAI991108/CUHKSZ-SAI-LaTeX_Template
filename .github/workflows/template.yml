name: template

# This is the workflow that runs in the public release mirror, where the
# template is the repository root.  The source repository has its own
# path-filtered copy under .github/workflows/template.yml.
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build SAI report template
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Check bilingual parity
        run: python3 scripts/check-parity.py

      - name: Build ZH and EN with TeX Live
        run: |
          docker run --rm \
            -v "$PWD":/work \
            -w /work \
            ghcr.io/xu-cheng/texlive-full:latest \
            bash -c './scripts/build.sh --clean --all'

      - name: Guard against course/author leakage
        run: |
          if grep -rniE 'AIE3905|S03|S06|Zijin|理工学院|School of Science' \
            main-*.tex metadata.tex styles frontmatter sections tables code references.bib; then
            echo "::error::course-specific text leaked into the template"
            exit 1
          fi

      - name: Upload PDFs
        uses: actions/upload-artifact@v7
        with:
          name: sai-report-template-pdfs
          path: |
            tmp/main-zh.pdf
            tmp/main-en.pdf
          if-no-files-found: error

      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: sai-report-template-logs
          path: tmp/*.log
          if-no-files-found: ignore

  windows-parse:
    name: Parse Windows build scripts
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - name: Parse PowerShell scripts
        shell: pwsh
        run: |
          $failed = $false
          foreach ($file in @('scripts/build.ps1', 'scripts/setup-miktex.ps1')) {
            $errors = $null
            $tokens = $null
            $path = [string](Resolve-Path $file)
            [System.Management.Automation.Language.Parser]::ParseFile($path, [ref]$tokens, [ref]$errors) | Out-Null
            if ($errors.Count -gt 0) {
              $failed = $true
              Write-Host "::error file=$file::$($errors[0].Message)"
              $errors | ForEach-Object {
                Write-Host ("  line " + $_.Extent.StartLineNumber + ": " + $_.Message)
              }
            }
            else {
              Write-Host "OK $file"
            }
          }
          if ($failed) { exit 1 }
